services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield_dev_password
      POSTGRES_DB: transactionshield
    volumes:
      - shield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield -d transactionshield"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://shield:shield_dev_password@db:5432/transactionshield
      MODEL_PATH: /app/artifacts/models/fraud_model.joblib
      METRICS_PATH: /app/artifacts/models/metrics.json
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
  broker:
    image: redpandadata/redpanda:v24.3.15
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://broker:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    profiles: ["tracking"]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    volumes:
      - shield_mlflow:/mlflow
    ports:
      - "127.0.0.1:5000:5000"
volumes:
  shield_pgdata:
  shield_mlflow:
