name: TransactionShield checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check ml backend tests scripts --select E9,F63,F7,F82
      - name: Unit and API tests
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: pytest -q
      - name: Train on fresh synthetic data
        run: |
          python scripts/generate_demo.py
          python -m ml.training.train --fast
          python scripts/create_report.py
      - name: Upload synthetic charts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-charts
          path: artifacts/reports/*.png
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
