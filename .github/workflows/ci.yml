name: TransactionShield checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check ml backend tests scripts streaming migrations --select E9,F63,F7,F82
      - name: Verify committed model and metrics checksum
        run: python scripts/verify_model_artifact.py
      - name: Emit honest synthetic-only release evidence
        run: python scripts/release_readiness.py --output artifacts/reports/release_readiness.json
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-only-release-evidence
          path: artifacts/reports/release_readiness.json
      - name: Unit and API tests
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: pytest -q
      - name: Smoke-test database migrations and API readiness
        env:
          DATABASE_URL: sqlite:////tmp/transactionshield-ci-migrate.sqlite3
        run: |
          alembic upgrade head
          python scripts/check_release.py
          python scripts/purge_demo_data.py --days 30
      - name: Authenticated ephemeral end-to-end API smoke test
        run: python scripts/smoke_e2e.py --report artifacts/reports/end_to_end_smoke.json
      - name: Verify fictional SQLite backup and recovery counts
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:////tmp/transactionshield-ci-migrate.sqlite3
        run: |
          python scripts/backup_demo_sqlite.py --source /tmp/transactionshield-ci-migrate.sqlite3 --output /tmp/transactionshield-ci-backup.sqlite3
          python scripts/backup_demo_sqlite.py --source /tmp/transactionshield-ci-migrate.sqlite3 --output /tmp/transactionshield-ci-backup.sqlite3 --confirm-synthetic-only
      - name: Upload end-to-end verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-e2e-evidence
          path: artifacts/reports/end_to_end_smoke.json
      - name: Validate Docker Compose configuration
        run: docker compose --profile streaming config --quiet
      - name: Train on fresh synthetic data
        run: |
          python scripts/generate_demo.py
          python -m ml.training.train --fast
          python scripts/verify_model_artifact.py
          python scripts/create_report.py
          python scripts/decision_costs.py
      - name: Repeat synthetic rolling-origin baseline evaluation
        run: python scripts/rolling_backtest.py
      - name: Upload synthetic charts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-charts
          path: |
            artifacts/reports/*.png
            artifacts/reports/rolling_backtest.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
  postgres-integration:
    name: PostgreSQL 16 integration (fictional transactions)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: shield_ci_password
          POSTGRES_DB: transactionshield_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shield -d transactionshield_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://shield:shield_ci_password@localhost:5432/transactionshield_ci
      ENVIRONMENT: test
      API_KEY: ci-only-synthetic-PostgreSQL-key
      DEMO_RATE_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Migrate fresh isolated PostgreSQL database
        run: alembic upgrade head
      - name: Run authenticated PostgreSQL API smoke and rollback checks
        run: python scripts/smoke_postgres.py --report artifacts/reports/postgres_ci_smoke.json
      - name: Upload PostgreSQL synthetic integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-postgres-integration
          path: artifacts/reports/postgres_ci_smoke.json
  docker-build:
    name: Build backend and frontend Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FastAPI model-serving image
        run: docker build --file backend/Dockerfile --tag transactionshield-backend:ci .
      - name: Build React/Nginx image
        run: docker build --file frontend/Dockerfile --tag transactionshield-frontend:ci .
  source-bundle:
    name: Archive tested source
    if: github.event_name == 'push'
    needs: [python, frontend, postgres-integration, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package exact tested commit
        run: |
          git archive --format=zip --output=TransactionShield-source.zip HEAD
          sha256sum TransactionShield-source.zip > TransactionShield-source.zip.sha256
          echo "Source archive commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source bundle and checksum
        uses: actions/upload-artifact@v4
        with:
          name: TransactionShield-source-${{ github.sha }}
          path: |
            TransactionShield-source.zip
            TransactionShield-source.zip.sha256
          retention-days: 30
