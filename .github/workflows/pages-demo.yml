name: Publish offline synthetic UI preview
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'artifacts/models/metrics.json'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: static-demo-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build clearly labeled static, offline demo
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: 'true'
          GITHUB_PAGES_BASE: '/TransactionShield-a-Real-Time-Fraud-Detection-and-Risk-Scoring-Platform./'
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
